plugins {
    id 'fabric-loom'
}

description = '人体周天光迹与内观表现，直接接入通用 UI 的客户端扩展。'

dependencies {
    minecraft libs.minecraft
    mappings "net.fabricmc:yarn:${libs.versions.yarn.get()}:v2"
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    modImplementation libs.owo
    // 组合进来的 UI、Inventory UI 与 Progression 客户端模组取 named 开发 JAR 编译（上游随本仓先行构建）；
    // 开发运行由完整装配按替换坐标装入，这里不再声明第二份。
    compileOnly('dev.kizuna.meridian.ui:client') { targetConfiguration = 'namedElements' }
    compileOnly('dev.kizuna.inventoryui:kizuna-inventory-ui-framework') { targetConfiguration = 'namedElements' }
    compileOnly('dev.kizuna.meridian.progression:client') { targetConfiguration = 'namedElements' }
    // 人体展示包是普通 Java 库，不在完整装配清单的运行模块里，由本仓直接装入。
    implementation('dev.kizuna.meridian.human:client') { transitive = false }
    implementation 'local.meridian:client'
    implementation 'dev.kizuna.meridian.human:shared'
    implementation 'dev.kizuna.meridian.progression:shared'
    // 完整装配按坐标重映射 Human、Progression 等模组时，Loom 以真实坐标重新加入 Framework server；Framework 的替换键仍是
    // local.meridian，运行与测试类路径直接声明组合工程，冲突时才会解析到同一组合工程，而不是去外部仓库找不存在的发布坐标。
    localRuntime 'local.meridian:server'
    testRuntimeOnly 'local.meridian:server'
    testImplementation libs.junit4
    testImplementation 'dev.kizuna.meridian.human:server'
    // 单元测试直接使用 UI 的路线类型，测试类路径单独补上同一份 named JAR。
    testImplementation('dev.kizuna.meridian.ui:client') { targetConfiguration = 'namedElements' }
}

test { useJUnit() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')

// 真实客户端验收单独装配可信出生样例，生产模块不依赖人体服务端。
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
dependencies {
    smokeImplementation 'dev.kizuna.meridian.human:server'
    smokeImplementation 'local.meridian:server'
    // 验收代码用组合工程的 named 开发 JAR 编译；运行依赖仍只由 full-assembly 重映射并装入一次。
    smokeCompileOnly('dev.kizuna.meridian.human:fabric') { targetConfiguration = 'namedElements' }
    smokeCompileOnly('dev.kizuna.meridian.progression:fabric') { targetConfiguration = 'namedElements' }
    smokeCompileOnly('dev.kizuna.inventoryui:server') { targetConfiguration = 'namedElements' }
}
loom {
    mods {
        meridian_human_ui { sourceSet sourceSets.main }
        meridian_human_ui_smoke { sourceSet sourceSets.smoke }
    }
    runs {
        smoke {
            client()
            source sourceSets.smoke
            runDir 'build/smoke'
            property 'kiui.smoke', 'true'
            property 'meridian.openingEffectsSmoke', providers.gradleProperty('openingEffectsSmoke').getOrElse('false')
            property 'meridian.revivalSmoke', providers.gradleProperty('revivalSmoke').getOrElse('false')
            programArgs '--width', '1440', '--height', '1000'
        }
    }
}
