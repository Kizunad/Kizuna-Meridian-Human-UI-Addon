pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

// 相邻仓库位置、产物路径与第三方版本都由 Framework 的工作区脚本提供（kizunaWorkspace、libs）。
apply from: new File(rootDir.parentFile, 'Kizuna-Meridian-Mod-Framework/scripts/workspace.gradle')

rootProject.name = 'kizuna-meridian-human-ui-addon'
include 'client'

// 人体、UI、Inventory UI、Progression 与框架都按装配清单目录以源码组合，不复制源码或协议。
// 同一仓库被多处组合时只采用最先登记的替换规则：Progression 只登记 Framework server，Human 只登记 Inventory UI server，
// UI 只登记 Progression client/shared，所以 Framework、Inventory UI、Progression 依次排在它们之前。
kizunaWorkspace.includeSource('framework', [client: 'local.meridian:client', server: 'local.meridian:server'])
kizunaWorkspace.includeSource('inventory-ui', ['': 'dev.kizuna.inventoryui:kizuna-inventory-ui-framework', server: 'dev.kizuna.inventoryui:server'])
// 模组仓的替换键一律用各工程自身的 group 与工程名，与 Human、UI 等仓的登记一致：
// 依赖处按真实坐标声明这些模组，键相同才会替换到同一组合工程。
kizunaWorkspace.includeSource('progression', [
        client: 'dev.kizuna.meridian.progression:client',
        server: 'dev.kizuna.meridian.progression:server',
        shared: 'dev.kizuna.meridian.progression:shared',
        fabric: 'dev.kizuna.meridian.progression:fabric'
])
kizunaWorkspace.includeSource('human', [
        client: 'dev.kizuna.meridian.human:client',
        server: 'dev.kizuna.meridian.human:server',
        shared: 'dev.kizuna.meridian.human:shared',
        fabric: 'dev.kizuna.meridian.human:fabric'
])
kizunaWorkspace.includeSource('ui', [client: 'dev.kizuna.meridian.ui:client'])
